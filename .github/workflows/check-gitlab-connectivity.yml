name: Check public GitLab connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - name: Test fixed public GitLab endpoint without credentials
        shell: bash
        run: curl --silent --show-error --head --connect-timeout 10 --max-time 15 https://gitlab.aigov.go.kr/
