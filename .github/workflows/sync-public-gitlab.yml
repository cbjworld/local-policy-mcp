name: Sync public GitLab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-gitlab-main-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync main through the Seoul execution region
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.GITLAB_SYNC_TOKEN,commit=process.env.GITHUB_SHA;
          if(!token||!/^[a-f0-9]{40}$/.test(commit||''))throw Error('Missing sync token or commit');
          for(let attempt=0;attempt<2;attempt++){
            const response=await fetch('https://local-policy-gitlab-sync.vercel.app/api/sync',{
              method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({commit}),signal:AbortSignal.timeout(260000)
            });
            const result=await response.json().catch(()=>({error:'INVALID_SERVER_RESPONSE'}));
            if(response.ok&&['synchronized','already_current'].includes(result.status)&&result.commit===commit){console.log(JSON.stringify(result));break;}
            if(response.ok&&result.status==='superseded'&&/^[a-f0-9]{40}$/.test(result.sourceCommit||'')){console.log(JSON.stringify(result));break;}
            if(attempt===0&&[409,429,502].includes(response.status)&&!['NON_FAST_FORWARD_OR_HISTORY_GAP','PUSH_VERIFICATION_FAILED'].includes(result.error)){await new Promise(r=>setTimeout(r,5000));continue;}
            throw Error('GitLab sync failed: HTTP '+response.status+' '+String(result.error||'UNKNOWN').slice(0,80)+' '+String(result.code||'')+' '+String(result.httpStatus||''));
          }
          NODE
