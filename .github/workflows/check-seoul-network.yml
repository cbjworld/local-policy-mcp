name: Check Seoul public source connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-seoul-network.yml']
permissions: {}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Test two fixed official public addresses
        shell: python
        run: |
          import json, os, time, urllib.request, platform
          rows = []
          for url in ['https://www.open.go.kr/', 'https://opengov.seoul.go.kr/section/D0000057368455']:
              started = time.monotonic()
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'PolicyResearchPrototype/0.2'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      data = response.read(512)
                      row = {'url': url, 'status': response.status, 'sampleBytes': len(data), 'finalUrl': response.url}
              except Exception as error:
                  row = {'url': url, 'error': type(error).__name__, 'reason': type(getattr(error, 'reason', None)).__name__}
              row['ms'] = round((time.monotonic() - started) * 1000)
              rows.append(row)
          result = {'os': platform.system(), 'results': rows}
          print('SEOUL_NETWORK_RESULT ' + json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Fixed public source connectivity: ' + platform.system() + '\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
